name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.24.5

jobs:
  verify:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Verify architecture boundaries
        run: dart run melos run check:architecture

      - name: Check formatting
        run: dart run melos run format:check

      - name: Analyze Flutter packages
        run: dart run melos run analyze:flutter

      - name: Analyze CLI package
        run: dart run melos run analyze:cli

      - name: Test Flutter packages
        run: dart run melos run test:flutter

      - name: Test CLI package
        run: dart run melos run test:cli

      - name: Build CLI executable
        run: dart run melos run build
